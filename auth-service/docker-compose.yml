services:
  # Message Broker (Shared)
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - keuangan-net
    restart: always

  # Auth Service Database
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "33061:3306" # Expose host port to avoid conflict with local mysql
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - keuangan-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service App
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8000"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/bootstrap/cache
    environment:
      - APP_ENV=local
      - APP_KEY=base64:m3o+1Lm3xFyQMU3CLlQH2tM+JTgiYOzqaN86R2IvJJg=
      - APP_DEBUG=true
      - DB_HOST=auth-db
      - DB_PORT=3306
      - DB_DATABASE=auth_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      - REDIS_PREFIX=
      - NOTIFICATIONS_QUEUE=queue:notifications
    networks:
      - keuangan-net
    restart: always

  # =================================================================
  # PLACEHOLDER FOR P2: account-service & account-db
  # =================================================================
  # account-db:
  #   image: mysql:8.0
  #   container_name: account-db
  #   ...
  #
  # account-service:
  #   build:
  #     context: ../account-service
  #   ports:
  #     - "8002:8000"
  #   ...

  # =================================================================
  # PLACEHOLDER FOR P3: transaction-service & transaction-db
  # =================================================================
  # transaction-db:
  #   image: postgres:16
  #   container_name: transaction-db
  #   ...
  #
  # transaction-service:
  #   build:
  #     context: ../transaction-service
  #   ports:
  #     - "8003:8000"
  #   ...

  # =================================================================
  # PLACEHOLDER FOR P4: debt-notify-service & debt-db & worker
  # =================================================================
  # debt-db:
  #   image: mysql:8.0
  #   container_name: debt-db
  #   ...
  #
  # debt-notify-service:
  #   build:
  #     context: ../debt-notify-service
  #   ports:
  #     - "8004:8000"
  #   ...
  #
  # debt-notify-worker:
  #   build:
  #     context: ../debt-notify-service
  #     dockerfile: Dockerfile.worker
  #   ...

volumes:
  redis_data:
    driver: local
  auth_db_data:
    driver: local

networks:
  keuangan-net:
    name: keuangan-net
    driver: bridge
